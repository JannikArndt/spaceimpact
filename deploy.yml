name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: npm test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # `caprover deploy -b` needs real git history, not a 1-commit shim

      - name: Deploy to CapRover
        env:
          CAPROVER_URL: https://captain.timpanini.com
          CAPROVER_APP: ${{ secrets.CAPROVER_APP }}
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
          CAPROVER_BRANCH: main
        # Pinned to an exact version deliberately. The token travels only as
        # an env var, never a CLI flag.
        run: npx --yes caprover@2.4.4 deploy

      - name: Confirm the new build is actually live
        if: vars.APP_URL != ''
        run: |
          want="$(node server/buildid.mjs)"
          for i in $(seq 1 30); do
            got="$(curl -fsS "${{ vars.APP_URL }}/version" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).build))' || true)"
            if [ "$got" = "$want" ]; then
              echo "live: $got"
              exit 0
            fi
            sleep 10
          done
          echo "::error::deploy finished but /version never reported build $want (saw: $got)"
          exit 1
